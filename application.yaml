apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stocks-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cloudacademy/stocks-app-gitops.git
    targetRevision: jenkins-demo
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: stocks-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
